services:
  db:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mashvini}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mashvini}
      POSTGRES_DB: ${POSTGRES_DB:-mashvini}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mashvini} -d ${POSTGRES_DB:-mashvini}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: packages/backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-mashvini}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-mashvini}
      DATABASE_NAME: ${POSTGRES_DB:-mashvini}
      CORS_ALLOWED_ORIGINS: '["http://localhost:5173"]'
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    profiles: ["full"]
    build:
      context: packages/backend
    command: ["uvicorn", "checkout.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-mashvini}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-mashvini}
      DATABASE_NAME: ${POSTGRES_DB:-mashvini}
      CORS_ALLOWED_ORIGINS: '["http://localhost:5173"]'
      PAYMENT_SIMULATOR_ENABLED: "true"
    volumes:
      - ./packages/backend/src:/app/src
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    profiles: ["full"]
    build:
      context: packages/frontend
      target: dev
      args:
        VITE_API_URL: http://localhost:8000
        VITE_PAYMENT_SIMULATOR: "true"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_PAYMENT_SIMULATOR: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./packages/frontend/src:/app/src
    ports:
      - "5173:5173"

volumes:
  db-data:
